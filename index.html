<!DOCTYPE html>
<!--
  ============================================================
  VERSION REACT — Éditeur de classe Warzone (Black Ops 7)
  ============================================================
  Cette version fait EXACTEMENT la même chose que index.html,
  mais l'interface est construite avec React (chargé depuis un CDN,
  donc AUCUNE installation : tu uploades juste ce fichier + donnees.js).

  Quand tu seras satisfait, tu pourras renommer ce fichier en index.html.
  En attendant, ton index.html actuel reste intact et en ligne.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WZ Guide — Éditeur de classe Warzone (BO7)</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1c24'/%3E%3Cg fill='none' stroke='%234fd0e6' stroke-width='2.5'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Cline x1='16' y1='2' x2='16' y2='7'/%3E%3Cline x1='16' y1='25' x2='16' y2='30'/%3E%3Cline x1='2' y1='16' x2='7' y2='16'/%3E%3Cline x1='25' y1='16' x2='30' y2='16'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%234fd0e6'/%3E%3C/svg%3E">

  <!-- ========== STYLE (identique à index.html) ========== -->
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #123642 0%, #0c2029 45%, #081319 100%) fixed;
      color: #e8eaed;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sous-titre { color: #9aa0a6; margin: 0 0 24px; font-size: 14px; }

    .layout { display: flex; gap: 24px; flex-wrap: wrap; }
    .colonne {
      background: #1e2127;
      border: 1px solid #2c3038;
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      min-width: 300px;
    }
    .colonne h2 { font-size: 15px; margin: 0 0 16px; color: #c8cdd4; text-transform: uppercase; letter-spacing: .5px; }

    .barre-arme { margin-bottom: 16px; }
    .barre-arme label { font-size: 13px; color: #c8cdd4; margin-right: 8px; }
    .barre-arme select {
      background: #1e2127; color: #e8eaed; border: 1px solid #2c3038;
      border-radius: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer;
    }

    .compteur { font-size: 13px; color: #9aa0a6; margin-bottom: 14px; font-weight: 600; }
    .compteur.plein  { color: #fbbf24; }
    .compteur.alerte { color: #f87171; }

    .slot { margin-bottom: 16px; }
    .slot .slot-label { display: block; font-size: 13px; color: #c8cdd4; margin-bottom: 6px; }
    .slot select {
      width: 100%;
      background: #14161a;
      color: #e8eaed;
      border: 1px solid #2c3038;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .slot select:hover { border-color: #3d8bfd; }
    .slot select.rempli { border-color: #3d8bfd; }
    .slot .desc { font-size: 12px; color: #9aa0a6; margin-top: 6px; min-height: 14px; }
    .slot .desc .effet { color: #4ade80; }

    .emp { margin-bottom: 16px; }
    .emp-label { font-size: 13px; color: #c8cdd4; margin-bottom: 6px; }
    .opt {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border: 1px solid #2c3038; border-radius: 8px;
      margin-bottom: 6px; cursor: pointer;
    }
    .opt:hover { border-color: #3d8bfd; }
    .opt.sel { border-color: #3d8bfd; background: #222733; }
    .opt input { margin: 0; }
    .opt-nom { font-size: 13px; }
    .opt-chips { margin-left: auto; display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
    .chip.bonus { background: rgba(74,222,128,.15); color: #4ade80; }
    .chip.malus { background: rgba(248,113,113,.15); color: #f87171; }
    .chip.info { background: rgba(159,212,228,.16); color: #9fd4e4; }
    .chips-ligne { display: inline-flex; gap: 5px; flex-wrap: wrap; }

    .dd { position: relative; }
    .dd-bouton {
      width: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      background: #14161a; color: #e8eaed; border: 1px solid #2c3038;
      border-radius: 8px; padding: 9px 10px; font-size: 14px; cursor: pointer; text-align: left;
      font-family: inherit; overflow: hidden;
    }
    .dd-bouton .dd-nom { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dd-bouton .chips-ligne { flex-basis: 100%; margin-top: 4px; }
    /* Pas d'étiquettes -> on ne réserve PAS de 2e ligne (sinon la case est trop haute). */
    .dd-bouton .chips-ligne:empty { display: none; margin-top: 0; }
    .dd-bouton:hover { border-color: #3d8bfd; }
    .dd-bouton.rempli { border-color: #3d8bfd; }
    .dd-bouton .fleche-bas { margin-left: auto; color: #6b7280; }
    .dd-liste {
      position: absolute; left: 0; top: calc(100% + 4px); z-index: 30;
      min-width: 100%; width: max-content; max-width: 300px;
      background: #1e2127; border: 1px solid #3d8bfd; border-radius: 8px; padding: 4px;
      max-height: 300px; overflow-y: auto; display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .gs-attachments .slot:nth-last-child(-n+2) .dd-liste { left: auto; right: 0; }
    .dd.ouvert .dd-liste { display: block; }
    .btn-reset { grid-column: 1 / -1; justify-self: start; align-self: start;
      width: auto; height: auto; margin-top: 6px; padding: 9px 14px; background: #2a1518; color: #f3a3a3;
      border: 1px solid #5a2a2f; border-radius: 8px; font-size: 13px; font-weight: 600; line-height: 1.2;
      white-space: nowrap; cursor: pointer; transition: background .15s, border-color .15s; }
    .btn-reset:hover:not(:disabled) { background: #3a1c20; border-color: #f87171; color: #ffb4b4; }
    .btn-reset:disabled { opacity: .4; cursor: default; }
    .dd-opt { display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 6px; cursor: pointer; }
    .dd-opt:hover { background: #222733; }
    .dd-opt.actif { background: #2a3140; }
    .dd-nom { font-size: 13px; }
    .dd-opt-texte { display: flex; flex-direction: column; }
    .dd-sous { font-size: 11px; color: #9aa0a6; margin-top: 2px; }
    .menu-cible-arme { display: inline-block; width: 300px; vertical-align: middle; }
    .menu-cible-cat { display: inline-block; width: 220px; vertical-align: middle; }
    .dd-opt-off { opacity: .4; cursor: not-allowed; }

    .stat { margin-bottom: 14px; }
    .stat-entete { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .stat-nom { color: #c8cdd4; }
    .stat-valeurs { font-variant-numeric: tabular-nums; }
    .base { color: #9aa0a6; }
    .fleche { color: #6b7280; margin: 0 4px; }
    .final { font-weight: 700; }
    .mieux { color: #4ade80; }
    .pire  { color: #f87171; }
    .egal  { color: #e8eaed; }

    .barre-fond { background: #2c3038; border-radius: 6px; height: 8px; overflow: hidden; }
    .barre-remplissage { height: 100%; border-radius: 6px; transition: width .2s; }

    .section-titre { font-size: 16px; margin: 32px 0 12px; color: #e8eaed; }

    .gunsmith {
      background: linear-gradient(160deg, #0f2c36 0%, #0a1c24 60%, #07141a 100%);
      border: 1px solid #16414f;
      border-radius: 16px;
      margin-bottom: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .gs-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 22px; border-bottom: 1px solid #16414f; background: rgba(0,0,0,.25);
      border-top-left-radius: 16px; border-top-right-radius: 16px;
    }
    .gs-title { font-weight: 800; letter-spacing: 4px; color: #bfe9f8; font-size: 15px; }
    .gs-wname { font-size: 22px; font-weight: 800; color: #fff; display: block; line-height: 1.1; }
    .gs-wcat { font-size: 12px; color: #6fb2c6; text-transform: uppercase; letter-spacing: 1.5px; }
    .gs-weapon { text-align: right; }

    .gs-body { display: flex; gap: 20px; padding: 22px; flex-wrap: wrap; align-items: flex-start; }
    .gs-left { flex: 1 1 440px; min-width: 320px; display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px; align-self: flex-start; }
    .gs-image {
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      background: radial-gradient(circle at 50% 38%, rgba(79,208,230,.12), transparent 70%);
      border-radius: 12px; padding: 18px 16px;
    }
    .gs-image svg, .gs-image img { width: 100%; max-width: 460px; height: auto; }
    .gs-image img { object-fit: contain; max-height: 240px; }
    .gs-weapon-picker { margin-top: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .gs-weapon-picker label { font-size: 12px; color: #6fb2c6; }

    .gs-stats { flex: 1 1 360px; min-width: 260px; background: rgba(0,0,0,.22); border-radius: 12px; padding: 18px; }
    .gs-stats h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9fd4e4; margin: 0 0 14px; }

    .gs-attachments { padding: 0; }
    .gs-attachments > div { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .gs-attachments .compteur { grid-column: 1 / -1; margin: 0; color: #9fd4e4; }
    .gs-attachments .slot { margin: 0; }
    .gs-attachments .slot-label { text-transform: uppercase; letter-spacing: .5px; font-size: 11px; color: #6fb2c6; }

    .app { display: flex; align-items: flex-start; gap: 0; }
    .sidebar {
      width: 230px; flex-shrink: 0; position: sticky; top: 24px;
      background: rgba(0,0,0,.28); border: 1px solid #16414f; border-radius: 14px;
      padding: 12px; transition: width .2s ease;
    }
    .sidebar.replie { width: 60px; }
    .sidebar-toggle {
      width: 100%; display: flex; justify-content: center; align-items: center;
      background: transparent; color: #9fd4e4; border: none; cursor: pointer;
      font-size: 20px; padding: 6px; margin-bottom: 10px;
    }
    .sidebar-toggle:hover { color: #fff; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px;
      border-radius: 9px; cursor: pointer; color: #c8cdd4; margin-bottom: 4px; white-space: nowrap;
    }
    .nav-item:hover { background: #16323d; color: #fff; }
    .nav-item.actif { background: #16414f; color: #fff; }
    .nav-item .ico { flex-shrink: 0; display: flex; }
    .sidebar.replie .nav-item .txt { display: none; }
    .sidebar.replie .nav-item { justify-content: center; padding: 11px 0; }

    .pub-slot { margin-top: 14px; padding-top: 12px; border-top: 1px solid #1d3a45; }
    .pub-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: #5a6b73; text-align: center; margin-bottom: 6px; }
    .pub-zone {
      min-height: 250px; display: flex; align-items: center; justify-content: center; text-align: center;
      background: #0e1a20; border: 1px dashed #2c4452; border-radius: 10px;
      color: #46555d; font-size: 12px; padding: 10px;
    }
    .sidebar.replie .pub-slot { display: none; }

    .lang-switch { display: flex; gap: 6px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #1d3a45; }
    .lang-btn {
      flex: 1; padding: 6px 0; background: #112b34; color: #9fb2bb; border: 1px solid #1d3a45;
      border-radius: 7px; font-size: 12px; font-weight: 700; letter-spacing: .03em; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .lang-btn:hover { background: #16323d; color: #fff; }
    .lang-btn.actif { background: #16414f; color: #fff; border-color: #2c6275; }
    .sidebar.replie .lang-switch { flex-direction: column; }

    .contenu { flex: 1; min-width: 0; padding-left: 24px; }

    .entete-vue {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      padding: 20px 24px; margin-bottom: 24px; border-radius: 14px; position: relative; overflow: hidden;
      background: radial-gradient(620px 220px at 0% -50%, rgba(79,208,230,.20), transparent 60%),
                  linear-gradient(160deg, #0f2c36 0%, #0a1c24 70%, #07141a 100%);
      border: 1px solid #16414f; box-shadow: 0 8px 28px rgba(0,0,0,.3);
      animation: apparition .5s ease both;
    }
    /* Le sous-titre n'a plus besoin de sa grande marge dans le bandeau encadré. */
    .entete-vue .sous-titre { margin-bottom: 0; }

    .mode-toggle { display: inline-flex; background: #14161a; border: 1px solid #2c3a45; border-radius: 10px; overflow: hidden; }
    .mode-toggle button { background: transparent; color: #9aa0a6; border: none; padding: 9px 18px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; }
    .mode-toggle button:hover { color: #fff; }
    .mode-toggle button.actif { background: #1f6feb; color: #fff; }

    .btn {
      background: #1e2733; color: #e8eaed; border: 1px solid #2c3a45;
      border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .btn:hover { border-color: #3d8bfd; }
    .btn-principal { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
    .btn-principal:hover { background: #2a7bff; }
    .btn-sup { color: #f87171; border-color: #5a2a2a; }
    .btn-sup:hover { border-color: #f87171; }

    .classe-card {
      background: #1e2127; border: 1px solid #2c3038; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .classe-nom { font-weight: 700; }
    .classe-armes { font-size: 13px; color: #9aa0a6; margin-top: 2px; }
    .classe-actions { display: flex; gap: 8px; }
    .vide { color: #9aa0a6; }

    .cmp-choix { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
    .cmp-choix label { font-size: 12px; color: #6fb2c6; margin-right: 8px; }
    .cmp-ligne { display: grid; grid-template-columns: 1fr 90px 90px; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #2c3038; }
    .cmp-ligne.tete { color: #9fd4e4; font-weight: 700; border-bottom: 2px solid #2c3038; }
    .cmp-stat { color: #c8cdd4; font-size: 13px; }
    .cmp-val { text-align: right; font-variant-numeric: tabular-nums; }
    .cmp-ligne.tete .cmp-val { text-align: right; font-size: 13px; }
    .cmp-val.gagne { color: #4ade80; font-weight: 700; }

    .tier { display: flex; align-items: stretch; gap: 12px; margin-bottom: 10px; }
    .tier-lettre { width: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; border-radius: 10px; color: #0c1116; }
    .tier-S .tier-lettre { background: #f87171; }
    .tier-A .tier-lettre { background: #fbbf24; }
    .tier-B .tier-lettre { background: #4ade80; }
    .tier-C .tier-lettre { background: #6fb2c6; }
    .tier-D .tier-lettre { background: #a78bfa; }
    .tier-N .tier-lettre { background: #4b5563; color: #e8eaed; }
    .meta-categorie { margin-bottom: 26px; }
    .meta-cat-titre { margin: 0 0 12px; font-size: 16px; font-weight: 700; color: #e8eaed; border-bottom: 1px solid #2c3038; padding-bottom: 6px; }
    .image-arme-zone { display: flex; align-items: center; justify-content: center; }
    .img-arme { display: block; width: 100%; max-width: 480px; height: auto; max-height: 170px; object-fit: contain; }
    .ia-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #161a20; border: 1px solid #2c3a45; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .ia-titre { font-weight: 700; color: #9be7ff; }
    .ia-select { background: #0f1216; color: #e8eaed; border: 1px solid #2c3a45; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    .ia-note { color: #9aa0a6; font-size: 13px; }
    .ttk-box { background: #161a20; border: 1px solid #2c3a45; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .ttk-val { font-size: 26px; font-weight: 800; color: #4fd0e6; line-height: 1; }
    .ttk-val small { font-size: 13px; color: #9aa0a6; font-weight: 600; }
    .ttk-detail { font-size: 13px; color: #c7ccd1; }
    .ttk-pv { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9aa0a6; }
    .ttk-pv select { background: #0f1216; color: #e8eaed; border: 1px solid #2c3a45; border-radius: 8px; padding: 4px 8px; font-size: 13px; }
    .ttkd-box { background: #161a20; border: 1px solid #2c3a45; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .ttkd-titre { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #9fd4e4; margin: 0 0 10px; }
    .ttkd-pv { color: #6b7280; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .ttkd-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ttkd-table th { text-align: left; color: #9aa0a6; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; padding: 4px 8px; border-bottom: 1px solid #2c3a45; }
    .ttkd-table td { padding: 6px 8px; border-bottom: 1px solid #1d2228; color: #e8eaed; font-variant-numeric: tabular-nums; }
    .ttkd-table th:not(:first-child), .ttkd-table td:not(:first-child) { text-align: right; }
    .ttkd-table tr:last-child td { border-bottom: none; }
    .ttkd-table tr.ttkd-best td { color: #4ade80; }
    .ttkd-table tr.ttkd-best td:last-child { font-weight: 800; }
    .ttkd-table tr.ttkd-worst td:last-child { color: #f0a878; }
    .mannequin-box { background: #161a20; border: 1px solid #2c3a45; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .mannequin-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .mannequin-svg { width: 132px; height: auto; flex-shrink: 0; }
    .mannequin-zone { stroke: #0f1216; stroke-width: 1.5; cursor: pointer; transition: filter .15s; }
    .mannequin-num { fill: #0f1216; font-weight: 800; font-size: 12px; text-anchor: middle; pointer-events: none; font-family: inherit; }
    .mannequin-legend { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 160px; }
    .mannequin-leg-row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; }
    .mannequin-leg-row.actif { background: #1d2530; }
    .mannequin-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
    .mannequin-leg-row .z { color: #c7ccd1; flex: 1; font-size: 13px; }
    .mannequin-leg-row .d { font-weight: 800; color: #fff; font-size: 14px; font-variant-numeric: tabular-nums; }
    .mannequin-leg-row .s { color: #9aa0a6; font-size: 11px; white-space: nowrap; }
    .ttkc-box { background: #161a20; border: 1px solid #2c3a45; border-radius: 12px; padding: 14px 16px; margin: 18px 0; }
    .ttkc-tete { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .ttkc-pv { font-size: 13px; color: #9aa0a6; display: flex; align-items: center; gap: 6px; }
    .ttkc-pv select { background: #0f1216; color: #e8eaed; border: 1px solid #2c3a45; border-radius: 8px; padding: 4px 8px; font-size: 13px; }
    .ttkc-legende { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; color: #c7ccd1; }
    .ttkc-leg { display: flex; align-items: center; gap: 7px; }
    .ttkc-dot { width: 16px; height: 4px; border-radius: 2px; flex-shrink: 0; }
    .ttkc-svg { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; background: rgba(0,0,0,.2); border-radius: 8px; }
    .ttkc-axis { fill: #6b7280; font-size: 11px; font-family: inherit; }
    .toggle-valeurs { margin-left: 12px; color: #c7ccd1; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .badge-maj { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 3px 10px; border-radius: 999px;
      background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.35); color: #4ade80;
      font-size: 12px; font-weight: 600; letter-spacing: .2px; }
    .badge-maj a { color: #9aa7b2; text-decoration: none; font-weight: 400; }
    .badge-maj a:hover { text-decoration: underline; }
    .toggle-valeurs input { vertical-align: middle; margin-right: 4px; }
    .recherche-wrap { position: relative; }
    .recherche-input { width: 100%; background: #0f1216; color: #e8eaed; border: 1px solid #2c3a45; border-radius: 8px; padding: 7px 10px; font-size: 13px; box-sizing: border-box; }

    /* ===================== PAGE D'ACCUEIL (hero + cartes) ===================== */

      position: relative; text-align: center; padding: 64px 24px 54px; margin-bottom: 36px;

    /* Lueur pulsante animée derrière le titre */
    .hero::before {
      content: ""; position: absolute; left: 50%; top: -28%; width: 680px; height: 480px;
      transform: translateX(-50%); pointer-events: none; z-index: 0;

    @keyframes lueur { 0%, 100% { opacity: .8; transform: translateX(-50%) scale(1); } 50% { opacity: 1; transform: translateX(-50%) scale(1.08); } }

    /* Visuel d'arme flottant dans le hero */

    @keyframes flotter { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(-3deg); } }

    /* Armes flottantes supplémentaires (décor) */
    .hero-arme2, .hero-arme3, .hero-arme4, .hero-arme5,
    .hero-arme6, .hero-arme7, .hero-arme8, .hero-arme9 {
      position: absolute; z-index: 0; pointer-events: none;

    }
    .hero-arme2 { left: -42px; top: -26px; width: 30%; max-width: 360px; opacity: .12; animation: flotter2 8s ease-in-out infinite; }
    .hero-arme3 { left: 9%; bottom: -30px; width: 22%; max-width: 280px; opacity: .08; animation: flotter3 9s ease-in-out infinite .6s; }
    .hero-arme4 { right: 13%; top: -22px; width: 20%; max-width: 250px; opacity: .09; animation: flotter2 7.5s ease-in-out infinite .3s; }
    .hero-arme5 { right: 31%; bottom: -42px; width: 26%; max-width: 300px; opacity: .07; animation: flotter3 8.5s ease-in-out infinite 1s; }
    .hero-arme6 { left: 34%; top: -34px; width: 17%; max-width: 220px; opacity: .06; animation: flotter2 9.5s ease-in-out infinite .9s; }
    .hero-arme7 { right: -18px; top: -18px; width: 24%; max-width: 300px; opacity: .08; animation: flotter 8.5s ease-in-out infinite .4s; }
    .hero-arme8 { left: -26px; bottom: -26px; width: 18%; max-width: 230px; opacity: .10; animation: flotter3 7s ease-in-out infinite .2s; }
    .hero-arme9 { left: 46%; bottom: -46px; width: 23%; max-width: 290px; opacity: .06; animation: flotter2 9s ease-in-out infinite 1.3s; }
    @keyframes flotter2 { 0%, 100% { transform: translateY(0) rotate(6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
    @keyframes flotter3 { 0%, 100% { transform: translateY(0) rotate(-9deg); } 50% { transform: translateY(-10px) rotate(-9deg); } }

    /* Vignettes d'armes sur les cartes */
    .carte-vignettes { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
    .carte-vignettes img { height: 32px; width: auto; max-width: 84px; object-fit: contain; opacity: .9; filter: drop-shadow(0 2px 4px rgba(0,0,0,.4)); }

    /* Animation d'apparition (hero + cartes) */
    @keyframes apparition { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .hero-logo  { animation: apparition .6s ease both; }
    .hero-slogan{ animation: apparition .6s ease .10s both; }

    .accueil-cartes .carte-nav:nth-child(1) { animation-delay: .05s; }
    .accueil-cartes .carte-nav:nth-child(2) { animation-delay: .12s; }
    .accueil-cartes .carte-nav:nth-child(3) { animation-delay: .19s; }
    .accueil-cartes .carte-nav:nth-child(4) { animation-delay: .26s; }
    @media (prefers-reduced-motion: reduce) {
      .hero::before, .hero-arme, .hero-arme2, .hero-arme3, .hero-arme4, .hero-arme5, .hero-arme6, .hero-arme7, .hero-arme8, .hero-arme9, .hero-logo, .hero-slogan, .hero-sous, .hero .badge-maj, .hero-cta, .carte-nav { animation: none; }
    }

    /* Bandeau d'en-tête des vues (Classes, Comparateur, Méta) */
    .banniere {
      display: flex; align-items: center; gap: 16px; padding: 20px 24px; margin-bottom: 24px;
      border-radius: 14px; position: relative; overflow: hidden;
      background: radial-gradient(620px 220px at 0% -50%, rgba(79,208,230,.20), transparent 60%),
                  linear-gradient(160deg, #0f2c36 0%, #0a1c24 70%, #07141a 100%);
      border: 1px solid #16414f; box-shadow: 0 8px 28px rgba(0,0,0,.3);
      animation: apparition .5s ease both;
    }
    .banniere-ico { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(79,208,230,.12); color: #4fd0e6; }
    .banniere-ico svg { width: 26px; height: 26px; }
    .banniere-titre { font-size: 22px; margin: 0; color: #fff; }
    .banniere-sous { margin: 4px 0 0; color: #9aa0a6; font-size: 14px; }

    .accueil-titre { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: #9fd4e4; margin: 0 0 14px; }
    .accueil-cartes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    .carte-nav {
      background: linear-gradient(160deg, #11313c, #0c2129); border: 1px solid #16414f;
      border-radius: 14px; padding: 24px; cursor: pointer; text-align: left;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .carte-nav:hover { transform: translateY(-4px); border-color: #4fd0e6; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
    .carte-ico { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: rgba(79,208,230,.12); color: #4fd0e6; margin-bottom: 14px; }
    .carte-ico svg { width: 24px; height: 24px; }
    .carte-titre { font-size: 17px; font-weight: 700; color: #fff; margin: 0 0 6px; }
    .carte-desc { font-size: 13px; color: #9aa0a6; margin: 0; line-height: 1.5; }
    .carte-fleche { color: #4fd0e6; font-weight: 700; margin-top: 12px; font-size: 13px; }

    .menu-cible-arme, .menu-cible-cat { max-width: 100%; }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .app { flex-direction: column; }
      .sidebar { width: auto; position: static; top: auto; }
      .sidebar-toggle { display: none; }
      .sidebar nav { display: flex; flex-wrap: wrap; gap: 6px; }
      .sidebar .nav-item { flex: 1 1 auto; justify-content: center; margin: 0; }
      .sidebar .nav-item .txt { display: inline; }
      .contenu { padding-left: 0; padding-top: 16px; }
      h1 { font-size: 19px; }
      .gs-body { flex-direction: column; gap: 14px; padding: 14px; }
      .gs-left, .gs-image, .gs-stats { min-width: 0; flex-basis: auto; width: 100%; }
      .gs-left { position: static; top: auto; }
      .pub-zone { min-height: 90px; }
      .gs-topbar { padding: 12px 14px; }
      .gs-weapon-picker { width: 100%; }
      .menu-cible-arme, .menu-cible-cat { width: 100%; }
      .gs-attachments { padding: 0; }
      .gs-attachments > div { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .layout { gap: 14px; }
      .colonne { min-width: 0; flex-basis: 100%; padding: 16px; }
      /* Mobile : le menu déroulant épouse la largeur de son emplacement et ne déborde jamais de l'écran. */
      .dd-liste,
      .gs-attachments .slot:nth-last-child(-n+2) .dd-liste {
        left: 0; right: auto; width: 100%; min-width: 100%; max-width: 100%;
      }
      .entete-vue { gap: 12px; }
      .mode-toggle, .btn-enregistrer { width: 100%; }
      .mode-toggle button { flex: 1; }

      .hero { padding: 40px 16px 34px; }
      .hero-logo { font-size: 38px; letter-spacing: 4px; }
      .hero-slogan { font-size: 17px; }
      .hero-arme, .hero-arme2, .hero-arme3, .hero-arme4, .hero-arme5, .hero-arme6, .hero-arme7, .hero-arme8, .hero-arme9 { display: none; }
    }

<body>
  <div id="root"></div>

  <!-- DONNÉES (même fichier que la version vanilla) -->
  <script src="donnees.js?v=6"></script>
  <!-- TRADUCTIONS (FR / EN / DE) -->
  <script src="traductions.js?v=10"></script>

  <!-- React + Babel depuis un CDN : aucune installation requise -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>

  <!-- ========== APPLICATION REACT ========== -->
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, Fragment } = React;

    /* ===== INTERNATIONALISATION (i18n) =====
       LANGUE : variable de module. t(fr) traduit une chaîne française
       vers la langue active (EN/DE) via window.TRAD, sinon renvoie le FR.
       Auto-détection au 1er chargement (navigator.language), puis mémorisée. */
    const LANGUES_OK = ["fr", "en", "de"];
    function detecterLangue() {
      try {
        const sauv = localStorage.getItem("wz_langue");
        if (sauv && LANGUES_OK.includes(sauv)) return sauv;
        const nav = (navigator.language || navigator.userLanguage || "fr").slice(0, 2).toLowerCase();
        return LANGUES_OK.includes(nav) ? nav : "fr";
      } catch (e) { return "fr"; }
    }
    let LANGUE = detecterLangue();
    function t(fr) {
      if (fr == null) return fr;
      if (LANGUE === "fr") return fr;
      const dico = (typeof window.TRAD !== "undefined") ? window.TRAD[LANGUE] : null;
      if (dico && dico[fr] != null) return dico[fr];
      // repli : traducteur d'accessoires par tokens (noms propres conservés)
      if (typeof window.trArme === "function") return window.trArme(fr, LANGUE);
      return fr;
    }

    /* ===== LOGIQUE PURE (reprise de index.html, sans dépendance au DOM) ===== */
    function etatVide(emplacements) {
      const o = {};
      emplacements.forEach(e => o[e.id] = "aucun");
      return o;
    }
    function appliquerMod(valeurBase, valeurActuelle, modificateur) {
      if (modificateur.includes("%")) {
        const pourcent = parseFloat(modificateur);
        return valeurActuelle + valeurBase * (pourcent / 100);
      }
      return valeurActuelle + parseFloat(modificateur);
    }
    function compterAccessoires(etat) {
      return Object.values(etat).filter(v => v !== "aucun").length;
    }
    // atoutsActifs = liste d'atouts (ATOUTS_WARZONE/...) ou null ; atoutsSel = sélection {slotId: optId}
    function calculerStatsFinales(arme, etat, emplacements, atoutsActifs, atoutsSel) {
      const finales = { ...arme.stats_base };
      emplacements.forEach(emp => {
        const opt = emp.options.find(o => o.id === etat[emp.id]);
        if (!opt || !opt.modificateurs) return;
        for (const stat in opt.modificateurs) {
          finales[stat] = appliquerMod(arme.stats_base[stat], finales[stat], opt.modificateurs[stat]);
        }
      });
      if (atoutsActifs && atoutsSel) {
        atoutsActifs.forEach(slot => {
          const atout = slot.options.find(o => o.id === atoutsSel[slot.id]);
          if (!atout || !atout.modificateurs) return;
          for (const stat in atout.modificateurs) {
            finales[stat] = appliquerMod(arme.stats_base[stat], finales[stat], atout.modificateurs[stat]);
          }
        });
      }
      for (const stat in finales) finales[stat] = Math.round(finales[stat] * 100) / 100;
      return finales;
    }
    function chipsAffectes(option, afficherValeurs) {
      let html = "";
      // 1) Effets simulés (modifient les stats) : vert = bonus, rouge = malus.
      if (option.modificateurs) {
        html += Object.entries(option.modificateurs).map(([stat, val]) => {
          const infos = INFOS_STATS[stat];
          const valeur = parseFloat(val);
          const estBonus = infos.plusGrandEstMieux ? (valeur > 0) : (valeur < 0);
          const texte = afficherValeurs ? `${t(infos.court)} ${val}` : t(infos.court);
          return `<span class="chip ${estBonus ? "bonus" : "malus"}">${texte}</span>`;
        }).join("");
      }
      // 2) Effets affichés mais NON simulés (flinch, mobilité ADS, tir à la hanche…) : étiquette info.
      if (option.effets_extra) {
        html += Object.entries(option.effets_extra).map(([label, val]) => {
          const texte = afficherValeurs ? `${t(label)} ${val}` : t(label);
          return `<span class="chip info" title="${t("Effet réel non pris en compte dans le calcul des stats")}">${texte}</span>`;
        }).join("");
      }
      return html;
    }
    function calculerTTK(finales, pv) {
      const deg = finales.degats, cad = finales.cadence_cpm;
      if (!deg || !cad) return null;
      const stk = Math.max(1, Math.ceil(pv / deg));
      const intervalle = 60000 / cad;
      const ttk = Math.round((stk - 1) * intervalle);
      return { stk, ttk };
    }
    function optionsCategories(listeArmes, categories, opus) {
      return categories.map(cat => {
        const aDesArmes = listeArmes.some(a => a.categorie === cat && a.jeu === opus);
        return { id: cat, nom: aDesArmes ? t(cat) : t(cat) + " " + t("(à venir)"), desactive: !aDesArmes };
      });
    }
    function optionsJeux(listeArmes) {
      return JEUX.map(jeu => {
        const present = listeArmes.some(a => a.jeu === jeu);
        return { id: jeu, nom: present ? jeu : jeu + " " + t("(à venir)"), desactive: !present };
      });
    }
    function premiereCategorie(listeArmes, categories, opus) {
      return categories.find(cat => listeArmes.some(a => a.categorie === cat && a.jeu === opus));
    }
    const POIDS_OBJECTIFS = {
      polyvalent: { recul_vertical: 1.5, recul_horizontal: 1.5, gun_kick: 1, portee_m: 1.2, velocite_ms: 1, vitesse_visee_ms: 1, sprint_to_fire_ms: 1, mobilite: 0.8, capacite_chargeur: 0.6, vitesse_rechargement_ms: 0.5 },
      longue:     { portee_m: 3, velocite_ms: 2, recul_vertical: 2.5, recul_horizontal: 2.5, gun_kick: 1.5, capacite_chargeur: 0.6, vitesse_visee_ms: 0.2 },
      courte:     { vitesse_visee_ms: 3, sprint_to_fire_ms: 3, mobilite: 2, recul_horizontal: 1, recul_vertical: 1, gun_kick: 0.8, cadence_cpm: 0.8, capacite_chargeur: 0.4 },
      mobilite:   { mobilite: 3, vitesse_visee_ms: 2.5, sprint_to_fire_ms: 2.5, vitesse_rechargement_ms: 1, recul_horizontal: 0.6, recul_vertical: 0.6 },
      recul:      { gun_kick: 3, recul_horizontal: 3, recul_vertical: 3 }
    };
    const LABELS_OBJECTIFS = { polyvalent: "Polyvalent", longue: "Longue portée", courte: "Courte portée", mobilite: "Mobilité", recul: "Recul minimal" };
    function noterOption(arme, option, poids) {
      if (!option || !option.modificateurs) return 0;
      let score = 0;
      for (const stat in option.modificateurs) {
        const base = arme.stats_base[stat];
        if (base === undefined) continue;
        const ref = Math.abs(base) < 1e-6 ? 1 : Math.abs(base);
        const nouvelle = appliquerMod(base, base, option.modificateurs[stat]);
        const deltaRel = (nouvelle - base) / ref;
        const infos = INFOS_STATS[stat];
        const gain = infos.plusGrandEstMieux ? deltaRel : -deltaRel;
        score += (poids[stat] || 0) * gain;
      }
      return score;
    }
    function genererSelection(arme, objectif) {
      const poids = POIDS_OBJECTIFS[objectif] || POIDS_OBJECTIFS.polyvalent;
      const emps = arme.emplacements;
      const candidats = emps.map(emp => {
        let best = null, bestScore = 0;
        emp.options.forEach(opt => {
          if (opt.id === "aucun") return;
          const sc = noterOption(arme, opt, poids);
          if (sc > bestScore) { bestScore = sc; best = opt; }
        });
        return { slot: emp.id, opt: best, score: bestScore };
      }).filter(c => c.opt && c.score > 0);
      candidats.sort((a, b) => b.score - a.score);
      const retenus = candidats.slice(0, CAP_ACCESSOIRES);
      const sel = etatVide(emps);
      retenus.forEach(c => { sel[c.slot] = c.opt.id; });
      return { sel, retenus };
    }
    // -- SPRAY PATTERN SIMULÉ ---------------------------------------------
    // IMPORTANT : ce n'est PAS le vrai tracé in-game (non disponible en données
    // ouvertes). C'est une ESTIMATION calculée à partir des stats de recul
    // (vertical, horizontal, gun kick) qui réagit aux accessoires.
    // Générateur pseudo-aléatoire déterministe (même arme = même tracé).
    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function hashChaine(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    // Facteur de "recul 1re balle" combiné des accessoires équipés (1 = normal, 0.4 = −60%).
    // Lu depuis effets_extra["Recul 1re balle"] (ex: "−60%"). Plusieurs accessoires se multiplient.
    function facteurPremiereBalle(arme, etat, emplacements) {
      let f = 1;
      emplacements.forEach(emp => {
        const opt = emp.options.find(o => o.id === etat[emp.id]);
        if (opt && opt.effets_extra && opt.effets_extra["Recul 1re balle"]) {
          const p = parseFloat(String(opt.effets_extra["Recul 1re balle"]).replace("−", "-"));
          if (!isNaN(p)) f *= (1 + p / 100);
        }
      });
      return Math.max(0, f);
    }

    // Renvoie les points (en pixels, dans une vue WxH) du tracé de recul estimé.
    // fsr = facteur de recul de la 1re balle (1 = normal).
    function trajectoireRecul(finales, seed, nBalles, W, H, fsr) {
      const rand = mulberry32(seed);
      const V = finales.recul_vertical || 0;
      const Hr = finales.recul_horizontal || 0;
      const K = finales.gun_kick || 0;
      const facteur1re = (typeof fsr === "number") ? fsr : 1;
      const monteeParBalle = V * 0.13;   // px verticaux par balle
      const ampliH = Hr * 0.9;           // amplitude du balancement horizontal
      const gigue = K * 0.18;            // tremblement par balle
      const cx = W / 2, baseY = H - 14;
      let x = 0, y = 0, vitesseH = 0;
      const pts = [];
      for (let i = 0; i < nBalles; i++) {
        const mult = (i === 0) ? facteur1re : 1;   // la 1re balle subit le "recul 1re balle"
        // Montée verticale (un peu plus marquée vers la fin du chargeur).
        y += monteeParBalle * (0.7 + 0.7 * (i / nBalles)) * mult;
        // Marche horizontale amortie + tremblement.
        vitesseH += (rand() - 0.5) * ampliH * 0.7 * mult;
        vitesseH *= 0.78;
        x += vitesseH + (rand() - 0.5) * gigue * mult;
        // Coordonnées brutes (non bornées) : le zoom/cadrage est géré à l'affichage,
        // ce qui permet de voir TOUTES les balles même quand le recul est important.
        pts.push({ X: cx + x, Y: baseY - y });
      }
      return pts;
    }

    const SILHOUETTE_ARME = `
      <svg viewBox="0 0 480 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Silhouette d'arme">
        <defs>
          <linearGradient id="gmetal" x1="0" y1="0" x2="0" y2="1">

            <stop offset="1" stop-color="#14303a"/>
          </linearGradient>
        </defs>
        <g fill="url(#gmetal)" stroke="#4fd0e6" stroke-width="2" stroke-linejoin="round">
          <path d="M20 70 L70 64 L70 96 L20 104 Z"/>
          <rect x="70" y="62" width="150" height="40" rx="4"/>
          <rect x="220" y="68" width="150" height="22" rx="3"/>
          <rect x="370" y="74" width="92" height="9" rx="3"/>
          <rect x="120" y="44" width="46" height="18" rx="3"/>
          <path d="M150 102 L186 102 L196 150 L168 154 Z"/>
          <path d="M96 102 L120 102 L112 140 L92 138 Z"/>
        </g>
      </svg>`;
    function encoderClasse(c) { return btoa(unescape(encodeURIComponent(JSON.stringify(c)))); }
    function decoderClasse(code) {
      try { return JSON.parse(decodeURIComponent(escape(atob(code)))); } catch (e) { return null; }
    }
    const CLE_STOCKAGE = "wz_classes";
    function chargerStockage() { try { return JSON.parse(localStorage.getItem(CLE_STOCKAGE) || "[]"); } catch (e) { return []; } }
    function sauverStockage(arr) { try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(arr)); } catch (e) {} }

    const TOUTES_ARMES = [...ARMES_PRINCIPALES, ...ARMES_SECONDAIRES];

    /* ===== COMPOSANTS RÉUTILISABLES ===== */
    // Menu déroulant personnalisé coloré (équivalent de creerMenu).
    function Dropdown({ options, value, onChange, className }) {
      const [ouvert, setOuvert] = useState(false);
      const ref = useRef(null);
      const idRef = useRef("dd-" + Math.random().toString(36).slice(2));
      useEffect(() => {
        function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOuvert(false); }
        function onAutre(e) { if (e.detail !== idRef.current) setOuvert(false); }
        document.addEventListener("click", onDoc);
        window.addEventListener("dd:open", onAutre);
        return () => { document.removeEventListener("click", onDoc); window.removeEventListener("dd:open", onAutre); };
      }, []);
      const choisi = options.find(o => o.id === value) || options[0];
      const rempli = value && value !== "aucun";
      return (
        <div className={(className || "")} ref={ref}>
          <div className={"dd" + (ouvert ? " ouvert" : "")}>
            <button type="button" className={"dd-bouton" + (rempli ? " rempli" : "")}
              onClick={(e) => { e.stopPropagation(); setOuvert(o => { const next = !o; if (next) window.dispatchEvent(new CustomEvent("dd:open", { detail: idRef.current })); return next; }); }}>
              <span className="dd-nom">{choisi ? choisi.nom : ""}</span>
              <span className="chips-ligne" dangerouslySetInnerHTML={{ __html: choisi && choisi.chips ? choisi.chips : "" }} />
              <span className="fleche-bas">▾</span>
            </button>
            <div className="dd-liste">
              {options.map(o => (
                <div key={o.id}
                  className={"dd-opt" + (o.id === value ? " actif" : "") + (o.desactive ? " dd-opt-off" : "")}
                  onClick={() => { if (o.desactive) return; setOuvert(false); onChange(o.id); }}>
                  <span className="dd-opt-texte">
                    <span className="dd-nom">{o.nom}</span>
                    {o.sousTexte ? <span className="dd-sous">{o.sousTexte}</span> : null}
                  </span>
                  <span className="chips-ligne" style={{ marginLeft: "auto" }} dangerouslySetInnerHTML={{ __html: o.chips || "" }} />
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function WeaponImage({ arme }) {
      const [err, setErr] = useState(false);
      useEffect(() => setErr(false), [arme.id]);
      const src = arme.image || (typeof IMAGES_ARMES !== "undefined" ? IMAGES_ARMES[arme.id] : null);
      if (src && !err) {
        return <img src={src} alt={arme.nom} className="img-arme" onError={() => setErr(true)} />;
      }
      return <span dangerouslySetInnerHTML={{ __html: SILHOUETTE_ARME }} />;
    }

    function StatBars({ arme, finales }) {
      return (
        <Fragment>
          {Object.keys(arme.stats_base).map(stat => {
            const base = Math.round(arme.stats_base[stat] * 100) / 100;
            const fin = finales[stat];
            const infos = INFOS_STATS[stat];
            let cls = "egal";
            if (fin !== base) {
              const aug = fin > base;
              cls = (infos.plusGrandEstMieux ? aug : !aug) ? "mieux" : "pire";
            }
            const largeur = Math.min(100, (fin / infos.max) * 100);
            const couleur = cls === "pire" ? "#f87171" : cls === "mieux" ? "#4ade80" : "#6b7280";
            return (
              <div className="stat" key={stat}>
                <div className="stat-entete">
                  <span className="stat-nom">{t(infos.label)}</span>
                  <span className="stat-valeurs">
                    <span className="base">{base}</span>
                    <span className="fleche">→</span>
                    <span className={"final " + cls}>{fin}</span>
                  </span>
                </div>
                <div className="barre-fond">
                  <div className="barre-remplissage" style={{ width: largeur + "%", background: couleur }}></div>
                </div>
              </div>
            );
          })}
        </Fragment>
      );
    }

    // Tracé de recul estimé (spray pattern simulé), animé balle par balle à la vraie cadence.
    function SprayPattern({ finales, armeId, capacite, fsr }) {
      const W = 210, H = 240, cx = W / 2, baseY = H - 14;
      // Nombre de balles tracées = taille réelle du chargeur (réagit aux accessoires).
      // Plancher à 5 pour les petits chargeurs, plafond à 60 pour rester lisible.
      const n = Math.max(5, Math.min(60, Math.round(capacite || 20)));
      const facteur1re = (typeof fsr === "number") ? fsr : 1;
      const pts = trajectoireRecul(finales, hashChaine(armeId), n, W, H, facteur1re);
      // Intervalle réel entre deux balles = 60000 / cadence (coups/min). Borné en bas
      // pour rester visible sur les armes très rapides.
      const cadence = finales.cadence_cpm || 600;
      const intervalle = Math.max(30, 60000 / cadence);

      const [visibles, setVisibles] = useState(n);   // par défaut : tout affiché (statique)
      const [joue, setJoue] = useState(false);
      const [zoom, setZoom] = useState(1);           // facteur de zoom manuel (1 = cadrage auto)
      const rafRef = useRef(null);
      const debutRef = useRef(0);

      function stop() {
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
        setJoue(false);
      }
      function lire() {
        stop();
        setVisibles(0);
        setJoue(true);
        debutRef.current = performance.now();
        // Le nombre de balles visibles est calculé d'après le TEMPS RÉEL écoulé
        // (et non le nombre d'images), donc la cadence reste exacte même si le
        // navigateur bride la fréquence d'images.
        const etape = (maintenant) => {
          const ecoule = maintenant - debutRef.current;
          const compte = Math.min(n, Math.floor(ecoule / intervalle) + 1);
          setVisibles(compte);
          if (compte >= n) { rafRef.current = null; setJoue(false); return; }
          rafRef.current = requestAnimationFrame(etape);
        };
        rafRef.current = requestAnimationFrame(etape);
      }
      // Changement d'arme / de chargeur -> on stoppe l'anim, on réaffiche tout, on remet le zoom auto.
      useEffect(() => { stop(); setVisibles(n); setZoom(1); /* eslint-disable-next-line */ }, [armeId, n]);
      // Nettoyage à la disparition du composant.
      useEffect(() => () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); }, []);

      // Cadrage automatique : on calcule l'étendue de TOUTES les balles (pas seulement
      // les visibles) pour que l'échelle reste stable pendant l'animation, puis on borne
      // pour que tout tienne dans la vue. Le zoom manuel multiplie ce cadrage de base.
      const padX = 12, padTop = 14;
      let maxAbsX = 1, maxUp = 1;
      pts.forEach(p => {
        maxAbsX = Math.max(maxAbsX, Math.abs(p.X - cx));
        maxUp = Math.max(maxUp, baseY - p.Y);
      });
      const fitH = (W / 2 - padX) / maxAbsX;
      const fitV = (baseY - padTop) / maxUp;
      const baseFit = Math.min(1, fitH, fitV);       // ne jamais agrandir au-delà de l'échelle naturelle
      const echelle = baseFit * zoom;
      const mapPt = p => ({ X: cx + echelle * (p.X - cx), Y: baseY + echelle * (p.Y - baseY) });
      const ZMIN = 0.4, ZMAX = 4;
      const zoomer = (f) => setZoom(z => Math.max(ZMIN, Math.min(ZMAX, +(z * f).toFixed(3))));

      const montres = pts.slice(0, visibles).map(mapPt);
      const poly = montres.map(p => `${p.X.toFixed(1)},${p.Y.toFixed(1)}`).join(" ");
      return (
        <div className="spray-box">
          <div className="spray-tete">
            <h3 className="spray-titre">{t("Spray pattern")}</h3>
            <div className="spray-actions">
              <div className="spray-zoom" role="group" aria-label="Zoom">
                <button type="button" className="spray-zbtn" title={t("Dézoomer")} onClick={() => zoomer(1 / 1.4)} disabled={echelle <= ZMIN + 0.001}>−</button>
                <span className="spray-zval">{Math.round(zoom * 100)}%</span>
                <button type="button" className="spray-zbtn" title={t("Zoomer")} onClick={() => zoomer(1.4)} disabled={zoom >= ZMAX - 0.001}>+</button>
                <button type="button" className="spray-zbtn spray-zreset" title={t("Réinitialiser le zoom")} onClick={() => setZoom(1)} disabled={Math.abs(zoom - 1) < 0.001}>⤢</button>
              </div>
              <button className="spray-btn" onClick={joue ? stop : lire}>{joue ? t("⏸ Stop") : t("▶ Rejouer")}</button>
            </div>
          </div>
          <p className="spray-note">{t("Estimation simulée d'après le recul (vertical, horizontal, gun kick) — pas le tracé exact du jeu. Réagit aux accessoires. L'animation rejoue les impacts à la cadence réelle de l'arme.")}</p>
          <svg className="spray-svg" viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg">
            <line x1={cx} y1="12" x2={cx} y2={baseY} stroke="#1f3a44" strokeWidth="1" strokeDasharray="3 4" />
            <line x1="14" y1={baseY} x2={W - 14} y2={baseY} stroke="#1f3a44" strokeWidth="1" />
            <polyline points={poly} fill="none" stroke="#4fd0e6" strokeWidth="1.5" opacity="0.55" />
            {montres.map((p, i) => {
              const frac = n > 1 ? i / (n - 1) : 0;        // 0 = 1re balle, 1 = dernière
              const hue = 140 - 140 * frac;                // vert -> rouge
              const estDerniere = joue && i === montres.length - 1;
              // Points plus petits quand le chargeur est grand, pour rester lisible.
              const rBase = n > 45 ? 2.2 : n > 30 ? 2.7 : 3;
              return <circle key={i} cx={p.X} cy={p.Y} r={estDerniere ? rBase + 2.5 : (i === 0 ? rBase + 1 : rBase)}
                fill={`hsl(${hue},70%,55%)`} stroke={estDerniere ? "#fff" : "none"} strokeWidth={estDerniere ? 1.5 : 0} />;
            })}
            <circle cx={cx} cy={baseY} r="4.5" fill="none" stroke="#ffffff" strokeWidth="1.5" />
          </svg>
          <p className="spray-note" style={{ textAlign: "center", marginTop: "6px" }}>
            <span style={{ color: "hsl(140,70%,55%)" }}>{t("● 1re balle")}</span> &nbsp;→&nbsp; <span style={{ color: "hsl(0,70%,55%)" }}>{t("● dernière")}</span>
            &nbsp;({n} {t("balles")} · {Math.round(cadence)} {t("c/min")})
          </p>
          {facteur1re < 0.999 &&
            <p className="spray-note" style={{ textAlign: "center", marginTop: "2px", color: "#9fd4e4" }}>
              {t("Recul 1re balle simulé :")} {Math.round(facteur1re * 100)}% {t("du normal")}
            </p>}
        </div>
      );
    }

    function TTKBox({ finales, pvCible, setPvCible }) {
      const r = calculerTTK(finales, pvCible);
      const detail = r ? `${r.stk} ${t(r.stk > 1 ? "balles" : "balle")} · ${t("cadence")} ${Math.round(finales.cadence_cpm)} ${t("c/min")}` : t("Données insuffisantes");
      return (
        <Fragment>
          <div>
            <div className="ttk-val">TTK ≈ {r ? <Fragment>{r.ttk} <small>ms</small></Fragment> : "—"}</div>
            <div className="ttk-detail">{detail} <span style={{ color: "#6b7280" }}>{t("(tir au corps, courte portée)")}</span></div>
          </div>
          <label className="ttk-pv">{t("Cible :")}
            <select value={pvCible} onChange={(e) => setPvCible(parseInt(e.target.value, 10))}>
              <option value={250}>{t("Warzone (250 PV)")}</option>
              <option value={150}>{t("Multijoueur (150 PV)")}</option>
              <option value={100}>{t("Sans armure (100 PV)")}</option>
            </select>
          </label>
        </Fragment>
      );
    }

    // Tableau TTK selon la distance (paliers de dégâts réels codmunity).
    function TTKDistanceTable({ arme, finales, pvCible }) {
      const base = (typeof DEGATS_PALIERS !== "undefined" && DEGATS_PALIERS[arme.id]) ? DEGATS_PALIERS[arme.id] : null;
      if (!base || !base.length) {
        return (
          <div className="ttkd-box">
            <h3 className="ttkd-titre">{t("TTK selon la distance")}</h3>
            <p className="spray-note" style={{ margin: 0 }}>{t("Données de distance indisponibles pour cette arme.")}</p>
          </div>
        );
      }
      // Les accessoires de portée étendent les distances (ratio portée finale / base).
      const ratio = (arme.stats_base.portee_m && finales.portee_m) ? (finales.portee_m / arme.stats_base.portee_m) : 1;
      const tbs = 60000 / (finales.cadence_cpm || 600);
      const arrondiM = (m) => +(m * ratio).toFixed(m > 0 && m < 10 ? 1 : 0);
      const rows = base.map((p, i) => {
        const mStart = arrondiM(p.m);
        const next = base[i + 1];
        const mEnd = next ? arrondiM(next.m) : null;
        let stk = null, ttk = null;
        if (p.deg > 0) { stk = Math.max(1, Math.ceil(pvCible / p.deg)); ttk = Math.round((stk - 1) * tbs); }
        return { mStart, mEnd, deg: p.deg, stk, ttk };
      });
      const ttks = rows.filter(r => r.ttk != null).map(r => r.ttk);
      const ttkMin = Math.min(...ttks), ttkMax = Math.max(...ttks);
      return (
        <div className="ttkd-box">
          <h3 className="ttkd-titre">{t("TTK selon la distance")} <span className="ttkd-pv">· {pvCible} {t("PV")}</span></h3>
          <table className="ttkd-table">
            <thead>
              <tr><th>{t("Distance")}</th><th>{t("Dégâts")}</th><th>{t("Balles")}</th><th>TTK</th></tr>
            </thead>
            <tbody>
              {rows.map((r, i) => {
                let cls = "";
                if (r.ttk != null && ttks.length > 1) cls = r.ttk === ttkMin ? "ttkd-best" : r.ttk === ttkMax ? "ttkd-worst" : "";
                return (
                  <tr key={i} className={cls}>
                    <td>{r.mEnd != null ? `${r.mStart}–${r.mEnd} m` : `${r.mStart} m+`}</td>
                    <td>{r.deg > 0 ? r.deg : "—"}</td>
                    <td>{r.stk != null ? r.stk : t("hors de portée")}</td>
                    <td>{r.ttk != null ? `${r.ttk} ms` : "—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <p className="spray-note" style={{ margin: "8px 0 0" }}>{t("Dégâts au corps par palier de distance (codmunity). TTK = (balles − 1) × cadence. Réagit à la cadence et à la portée des accessoires.")}</p>
        </div>
      );
    }

    // Mannequin : dégâts par partie du corps (courte portée, source codmunity).
    function Mannequin({ arme, pvCible }) {
      const [survol, setSurvol] = useState(null);
      const p = (typeof DEGATS_PARTIES !== "undefined" && DEGATS_PARTIES[arme.id]) ? DEGATS_PARTIES[arme.id] : null;
      if (!p) {
        return (
          <div className="mannequin-box">
            <h3 className="ttkd-titre">{t("Dégâts par zone")}</h3>
            <p className="spray-note" style={{ margin: 0 }}>{t("Données par zone indisponibles pour cette arme.")}</p>
          </div>
        );
      }
      const zones = [
        { id: "head", label: t("Tête"), deg: p.head },
        { id: "neck", label: t("Cou"), deg: p.neck },
        { id: "chest", label: t("Torse"), deg: p.chest },
        { id: "stomach", label: t("Ventre"), deg: p.stomach },
        { id: "arm", label: t("Bras"), deg: p.arm },
        { id: "leg", label: t("Jambes"), deg: p.leg }
      ];
      const maxDeg = Math.max(...zones.map(z => z.deg)) || 1;
      const couleur = (deg) => { const r = deg / maxDeg; return `hsl(${Math.round((1 - r) * 120)}, 65%, 48%)`; };
      const stk = (deg) => deg > 0 ? Math.max(1, Math.ceil(pvCible / deg)) : null;
      const byId = {}; zones.forEach(z => byId[z.id] = z);
      const zStyle = (id) => ({ fill: couleur(byId[id].deg), filter: survol === id ? "brightness(1.35)" : "none" });
      const evt = (id) => ({ onMouseEnter: () => setSurvol(id), onMouseLeave: () => setSurvol(null), onClick: () => setSurvol(id), className: "mannequin-zone", style: zStyle(id) });
      const num = (id) => byId[id].deg;
      return (
        <div className="mannequin-box">
          <h3 className="ttkd-titre">{t("Dégâts par zone")} <span className="ttkd-pv">· {pvCible} {t("PV")}</span></h3>
          <div className="mannequin-wrap">
            <svg className="mannequin-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
              {/* jambes */}
              <rect {...evt("leg")} x="80" y="160" width="18" height="122" rx="8" />
              <rect {...evt("leg")} x="102" y="160" width="18" height="122" rx="8" />
              {/* bras */}
              <rect {...evt("arm")} x="44" y="74" width="20" height="88" rx="10" />
              <rect {...evt("arm")} x="136" y="74" width="20" height="88" rx="10" />
              {/* ventre */}
              <rect {...evt("stomach")} x="74" y="118" width="52" height="42" rx="6" />
              {/* torse */}
              <rect {...evt("chest")} x="70" y="70" width="60" height="48" rx="8" />
              {/* cou */}
              <rect {...evt("neck")} x="90" y="58" width="20" height="13" rx="3" />
              {/* tête */}
              <circle {...evt("head")} cx="100" cy="36" r="24" />
              {/* valeurs */}
              <text className="mannequin-num" x="100" y="40">{num("head")}</text>
              <text className="mannequin-num" x="100" y="98">{num("chest")}</text>
              <text className="mannequin-num" x="100" y="143">{num("stomach")}</text>
              <text className="mannequin-num" x="54" y="122">{num("arm")}</text>
              <text className="mannequin-num" x="146" y="122">{num("arm")}</text>
              <text className="mannequin-num" x="89" y="224">{num("leg")}</text>
              <text className="mannequin-num" x="111" y="224">{num("leg")}</text>
            </svg>
            <div className="mannequin-legend">
              {zones.slice().sort((a, b) => b.deg - a.deg).map(z => (

    // Graphique comparatif TTK selon la distance (deux armes superposées).
    function TTKCompareChart({ a, b, pvCible, setPvCible }) {
      const courbe = (arme) => {
        let pal = (typeof DEGATS_PALIERS !== "undefined" && DEGATS_PALIERS[arme.id]) ? DEGATS_PALIERS[arme.id] : null;
        if (!pal || !pal.length) {
          // Repli : pas de paliers de distance -> courbe plate à partir des dégâts de base.
          const d = arme.stats_base.degats;
          if (!d) return null;
          pal = [{ m: 0, deg: d }];
        }
        const tbs = 60000 / (arme.stats_base.cadence_cpm || 600);
        return pal.map(p => {
          const stk = p.deg > 0 ? Math.max(1, Math.ceil(pvCible / p.deg)) : null;
          return { m: p.m, ttk: stk != null ? Math.round((stk - 1) * tbs) : null };
        });
      };
      const cA = courbe(a), cB = courbe(b);
      const W = 620, H = 300, ml = 52, mr = 16, mt = 26, mb = 40;
      if (!cA && !cB) {
        return (
          <div className="ttkc-box">
            <h3 className="ttkd-titre">{t("TTK selon la distance")}</h3>
            <p className="spray-note" style={{ margin: 0 }}>{t("Données de distance indisponibles pour cette arme.")}</p>
          </div>
        );
      }
      const allPts = [...(cA || []), ...(cB || [])];
      const lastM = Math.max(30, ...allPts.map(p => p.m));
      const maxDist = Math.ceil((lastM + 6) / 10) * 10;
      const maxTtk = Math.max(100, ...allPts.map(p => p.ttk).filter(v => v != null));
      const plotW = W - ml - mr, plotH = H - mt - mb;
      const px = (m) => ml + (m / maxDist) * plotW;
      const py = (ttk) => (H - mb) - (ttk / maxTtk) * plotH;   // 0 en bas, plus rapide = plus bas
      const stepPts = (c) => {
        if (!c) return [];
        const out = [];
        c.forEach((p, i) => {
          if (p.ttk == null) return;
          const next = c[i + 1];
          out.push([px(p.m), py(p.ttk)], [px(next ? next.m : maxDist), py(p.ttk)]);
        });
        return out;
      };
      const polyStr = (c) => stepPts(c).map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
      const stepX = Math.max(10, Math.round(maxDist / 6 / 10) * 10);
      const xticks = []; for (let m = 0; m <= maxDist; m += stepX) xticks.push(m);
      const yticks = []; for (let i = 0; i <= 4; i++) yticks.push(Math.round(maxTtk * i / 4));
      return (
        <div className="ttkc-box">
          <div className="ttkc-tete">
            <h3 className="ttkd-titre">{t("TTK selon la distance")}</h3>
            <label className="ttkc-pv">{t("Cible :")}
              <select value={pvCible} onChange={(e) => setPvCible(parseInt(e.target.value, 10))}>
                <option value={250}>{t("Warzone (250 PV)")}</option>
                <option value={150}>{t("Multijoueur (150 PV)")}</option>
                <option value={100}>{t("Sans armure (100 PV)")}</option>
              </select>
            </label>
          </div>
          <div className="ttkc-legende">
            <span className="ttkc-leg"><span className="ttkc-dot" style={{ background: "#4fd0e6" }}></span>{a.nom}{!cA ? " — " + t("indispo.") : ""}</span>
            <span className="ttkc-leg"><span className="ttkc-dot" style={{ background: "#f59e0b" }}></span>{b.nom}{!cB ? " — " + t("indispo.") : ""}</span>
          </div>
          <svg className="ttkc-svg" viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg">
            {yticks.map((v, i) => (
              <g key={"y" + i}>
                <line x1={ml} y1={py(v)} x2={W - mr} y2={py(v)} stroke="#1f2a30" strokeWidth="1" />
                <text x={ml - 6} y={py(v) + 3} textAnchor="end" className="ttkc-axis">{v}</text>
              </g>
            ))}
            {xticks.map((m, i) => (
              <text key={"x" + i} x={px(m)} y={H - mb + 16} textAnchor="middle" className="ttkc-axis">{m}</text>
            ))}
            <text x={ml + plotW / 2} y={H - 4} textAnchor="middle" className="ttkc-axis">{t("Distance (m)")}</text>
            <text x={8} y={13} className="ttkc-axis">TTK (ms)</text>
            {cA && <polyline points={polyStr(cA)} fill="none" stroke="#4fd0e6" strokeWidth="2.5" strokeLinejoin="round" />}
            {cB && <polyline points={polyStr(cB)} fill="none" stroke="#f59e0b" strokeWidth="2.5" strokeLinejoin="round" />}
            {(cA || []).filter(p => p.ttk != null).map((p, i) => <circle key={"da" + i} cx={px(p.m)} cy={py(p.ttk)} r="3.5" fill="#4fd0e6" />)}
            {(cB || []).filter(p => p.ttk != null).map((p, i) => <circle key={"db" + i} cx={px(p.m)} cy={py(p.ttk)} r="3.5" fill="#f59e0b" />)}
          </svg>
          <p className="spray-note" style={{ margin: "8px 0 0" }}>{t("TTK au corps selon la distance, d'après les paliers de dégâts réels. Plus bas = plus rapide.")}</p>
        </div>
      );
    }

    // Emplacements d'accessoires (un menu par emplacement + compteur + règle des 5).

    // Recherche rapide d'arme principale.

      useEffect(() => {
        function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setQ(""); }

        return () => document.removeEventListener("click", onDoc);
      }, []);

      function choisirArmeS(arme) { setArmeS(arme); setSelS(etatVide(arme.emplacements)); setAlerteS(false); }
