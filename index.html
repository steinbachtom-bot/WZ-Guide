                <div>
                  <div className="hero">
                    {heroImg && <img className="hero-arme" src={heroImg} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    {aImg("mk78") && <img className="hero-arme2" src={aImg("mk78")} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    {aImg("kogot_7") && <img className="hero-arme3" src={aImg("kogot_7")} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    {aImg("strider_300") && <img className="hero-arme4" src={aImg("strider_300")} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    {aImg("swordfish_a1") && <img className="hero-arme5" src={aImg("swordfish_a1")} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    {aImg("mxr_17") && <img className="hero-arme6" src={aImg("mxr_17")} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    {aImg("hawker_hx") && <img className="hero-arme7" src={aImg("hawker_hx")} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    {aImg("coda_9") && <img className="hero-arme8" src={aImg("coda_9")} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    {aImg("xm325") && <img className="hero-arme9" src={aImg("xm325")} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                    <h1 className="hero-logo">WZ<span> GUIDE</span></h1>
                    <p className="hero-slogan">{t("Crée tes classes Warzone & Black Ops 7 optimales")}</p>
                    <p className="hero-sous">{t("Gunsmith complet, stats réelles, calcul du TTK, générateur de classe et tier list — le tout au même endroit.")}</p>
                    {typeof META_DONNEES !== "undefined" &&
                      <div className="badge-maj">📊 {META_DONNEES.saison} · {META_DONNEES.jeu} · {t("données")} {META_DONNEES.maj}</div>}
                    <div>
                      <button className="hero-cta" onClick={() => setVue("createur")}>{t("Créer une classe →")}</button>
                    </div>
                  </div>
                  <h2 className="accueil-titre">{t("Explorer")}</h2>
                  <div className="accueil-cartes">
                    {cartes.map(c => {
                      const it = navItems.find(n => n.id === c.id);
                      return (
                        <div className="carte-nav" key={c.id} onClick={() => setVue(c.id)}>
                          <div className="carte-ico">{it ? it.ico : null}</div>
                          <h3 className="carte-titre">{t(c.titre)}</h3>
                          <p className="carte-desc">{t(c.desc)}</p>
                          {c.vignettes && c.vignettes.length > 0 &&
                            <div className="carte-vignettes">
                              {c.vignettes.map(id => <img key={id} src={aImg(id)} alt="" onError={(e) => { e.target.style.display = "none"; }} />)}
                            </div>}
                          <div className="carte-fleche">{t("Ouvrir →")}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            {vue === "createur" && (
              <div>
                <div className="entete-vue">
                  <div>
                    <h1>{t("Éditeur de classe —")} {mode === "warzone" ? "Warzone" : "Black Ops"}
                      {typeof META_DONNEES !== "undefined" &&
                        <span className="badge-maj">
                          📊 {META_DONNEES.saison} · {META_DONNEES.jeu} · données {META_DONNEES.maj}{" "}
                          <a href={META_DONNEES.sourceUrl} target="_blank" rel="noopener">({META_DONNEES.source})</a>
                        </span>}
                    </h1>
                    <p className="sous-titre">{t("5 accessoires max par arme, un seul par emplacement. Étiquettes :")} <span style={{ color: "#4ade80" }}>{t("vert = bonus")}</span>, <span style={{ color: "#f87171" }}>{t("rouge = malus")}</span>.
                      <label className="toggle-valeurs">
                        <input type="checkbox" checked={afficherValeurs} onChange={(e) => setAfficherValeurs(e.target.checked)} /> {t("Afficher les valeurs (%)")}
                      </label>
                    </p>
                  </div>
                  <div className="mode-toggle">
                    <button className={mode === "warzone" ? "actif" : ""} onClick={() => changerMode("warzone")}>Warzone</button>
                    <button className={mode === "blackops" ? "actif" : ""} onClick={() => changerMode("blackops")}>Black Ops</button>
                  </div>
                  <button className="btn btn-principal btn-enregistrer" onClick={enregistrerClasse}>{t("Enregistrer la classe")}</button>
                  <button className="btn" onClick={(e) => { e.stopPropagation(); partagerClasse(); }}>{t("🔗 Partager")}</button>
                  <span className="ia-note">{notePartage}</span>
                </div>

                {/* ARME PRINCIPALE */}
                <div className="gunsmith">
                  <div className="gs-topbar">
                    <span className="gs-title">{t("GUNSMITH")}</span>
                    <span className="gs-weapon">
                      <span className="gs-wname">{armeP.nom}</span>
                      <span className="gs-wcat">{armeP.categorie ? t(armeP.categorie) : ""}</span>
                    </span>
                  </div>
                  <div className="gs-body">
                    <div className="gs-left">
                      <div className="gs-image">
                        <div className="image-arme-zone"><WeaponImage arme={armeP} /></div>
                        <div className="gs-weapon-picker">
                          <label>{t("Opus :")}</label>
                          <Dropdown className="menu-cible-cat" options={optionsJeux(ARMES_PRINCIPALES)} value={opusP} onChange={changeOpusP} />
                          <label>{t("Catégorie :")}</label>
                          <Dropdown className="menu-cible-cat" options={optionsCategories(ARMES_PRINCIPALES, CATEGORIES_PRINCIPALES, opusP)} value={catP} onChange={changeCatP} />
                          <label>{t("Arme :")}</label>
                          <Dropdown className="menu-cible-arme" options={ARMES_PRINCIPALES.filter(a => a.categorie === catP && a.jeu === opusP).map(a => ({ id: a.id, nom: a.nom }))} value={armeP.id} onChange={changeArmeP} />
                          <label>{t("Recherche rapide :")}</label>
                          <SearchBox onSelect={changeArmeP} />
                        </div>
                      </div>
                      <div className="gs-attachments">
                        <div className="ia-bar">
                          <span className="ia-titre">{t("✨ Générateur de classe")}</span>
                          <label>{t("Objectif :")}</label>
                          <select className="ia-select" value={iaObjectif} onChange={(e) => setIaObjectif(e.target.value)}>
                            <option value="polyvalent">{t("Polyvalent")}</option>
                            <option value="longue">{t("Longue portée")}</option>
                            <option value="courte">{t("Courte portée")}</option>
                            <option value="mobilite">{t("Mobilité")}</option>
                            <option value="recul">{t("Recul minimal")}</option>
                          </select>
                          <button className="btn btn-principal" onClick={(e) => { e.stopPropagation(); genererClasse(); }}>{t("Générer la classe")}</button>
                          <span className="ia-note">{iaNote}</span>
                        </div>
                        <AttachmentSlots emplacements={armeP.emplacements} selection={selP} onChange={changeAccP} onReset={() => { setSelP(etatVide(armeP.emplacements)); setAlerteP(false); }} alerte={alerteP} afficherValeurs={afficherValeurs} />
                      </div>
                    </div>
                    <div className="gs-stats">
                      <h2>{t("Statistiques")}</h2>
                      <div><StatBars arme={armeP} finales={finalesP} /></div>
                      <div className="ttk-box"><TTKBox finales={finalesP} pvCible={pvCible} setPvCible={setPvCible} /></div>
                      <TTKDistanceTable arme={armeP} finales={finalesP} pvCible={pvCible} />
                      <Mannequin arme={armeP} pvCible={pvCible} />
                      <SprayPattern finales={finalesP} armeId={armeP.id} capacite={finalesP.capacite_chargeur} fsr={fsrP} />
                    </div>
                  </div>
                </div>

                {/* ARME SECONDAIRE */}
                <div className="gunsmith">
                  <div className="gs-topbar">
                    <span className="gs-title">{t("GUNSMITH")}</span>
                    <span className="gs-weapon">
                      <span className="gs-wname">{armeS.nom}</span>
                      <span className="gs-wcat">{armeS.categorie ? t(armeS.categorie) : ""}</span>
                    </span>
                  </div>
                  <div className="gs-body">
                    <div className="gs-left">
                      <div className="gs-image">
                        <div className="image-arme-zone"><WeaponImage arme={armeS} /></div>
                        <div className="gs-weapon-picker">
                          <label>{t("Opus :")}</label>
                          <Dropdown className="menu-cible-cat" options={optionsJeux(ARMES_SECONDAIRES)} value={opusS} onChange={changeOpusS} />
                          <label>{t("Catégorie :")}</label>
                          <Dropdown className="menu-cible-cat" options={optionsCategories(ARMES_SECONDAIRES, CATEGORIES_SECONDAIRES, opusS)} value={catS} onChange={changeCatS} />
                          <label>{t("Arme :")}</label>
                          <Dropdown className="menu-cible-arme" options={ARMES_SECONDAIRES.filter(a => a.categorie === catS && a.jeu === opusS).map(a => ({ id: a.id, nom: a.nom }))} value={armeS.id} onChange={changeArmeS} />
                        </div>
                      </div>
                      <div className="gs-attachments">
                        <div className="ia-bar">
                          <span className="ia-titre">{t("✨ Générateur de classe")}</span>
                          <label>{t("Objectif :")}</label>
                          <select className="ia-select" value={iaObjectifS} onChange={(e) => setIaObjectifS(e.target.value)}>
                            <option value="polyvalent">{t("Polyvalent")}</option>
                            <option value="longue">{t("Longue portée")}</option>
                            <option value="courte">{t("Courte portée")}</option>
                            <option value="mobilite">{t("Mobilité")}</option>
                            <option value="recul">{t("Recul minimal")}</option>
                          </select>
                          <button className="btn btn-principal" onClick={(e) => { e.stopPropagation(); genererClasseS(); }}>{t("Générer la classe")}</button>
                          <span className="ia-note">{iaNoteS}</span>
                        </div>
                        <AttachmentSlots emplacements={armeS.emplacements} selection={selS} onChange={changeAccS} onReset={() => { setSelS(etatVide(armeS.emplacements)); setAlerteS(false); }} alerte={alerteS} afficherValeurs={afficherValeurs} />
                      </div>
                    </div>
                    <div className="gs-stats">
                      <h2>{t("Statistiques")}</h2>
                      <div><StatBars arme={armeS} finales={finalesS} /></div>
                      <TTKDistanceTable arme={armeS} finales={finalesS} pvCible={pvCible} />
                      <Mannequin arme={armeS} pvCible={pvCible} />
                      <SprayPattern finales={finalesS} armeId={armeS.id} capacite={finalesS.capacite_chargeur} fsr={fsrS} />
                    </div>
                  </div>
                </div>

                {/* ATOUTS & ÉQUIPEMENT */}
                <h2 className="section-titre">{t("Atouts & équipement")}</h2>
                <div className="layout">
                  <div className="colonne">
                    <h2>{t("Atouts")}</h2>
                    <SlotsList slots={ATOUTS} selection={atouts} onChange={(id, v) => setAtouts({ ...atouts, [id]: v })} afficherValeurs={afficherValeurs} />
                  </div>
                  <div className="colonne">
                    <h2>{t("Équipement")}</h2>
                    <SlotsList slots={EQUIPEMENTS} selection={equip} onChange={(id, v) => setEquip({ ...equip, [id]: v })} afficherValeurs={afficherValeurs} />
                  </div>
                </div>
              </div>
            )}

            {vue === "classes" && (
              <div>
                <Banniere icone={navItems.find(n => n.id === "classes").ico} titre={t("Classes enregistrées")}
                  sous={t("Tes classes sauvegardées sur cet ordinateur. Clique « Charger » pour réappliquer une classe.")} />
                {classes.length === 0
                  ? <p className="vide">{t("Aucune classe enregistrée pour l'instant. Compose une classe dans le créateur, puis clique « Enregistrer la classe ».")}</p>
                  : classes.map((c, i) => {
                    const ap = ARMES_PRINCIPALES.find(a => a.id === c.armePrincipale);
                    const as = ARMES_SECONDAIRES.find(a => a.id === c.armeSecondaire);
                    return (
                      <div className="classe-card" key={i}>
                        <div>
                          <div className="classe-nom">{c.nom}</div>
                          <div className="classe-armes">{ap ? ap.nom : "?"} + {as ? as.nom : "?"}</div>
                        </div>
                        <div className="classe-actions">
                          <button className="btn" onClick={() => appliquerClasse(c)}>{t("Charger")}</button>
                          <button className="btn btn-sup" onClick={() => supprimerClasse(i)}>{t("Supprimer")}</button>
                        </div>
                      </div>
                    );
                  })}
              </div>
            )}

            {vue === "comparateur" && (
              <div>
                <Banniere icone={navItems.find(n => n.id === "comparateur").ico} titre={t("Comparateur d'armes")}
                  sous={t("Compare les statistiques de base de deux armes — le vert indique la meilleure des deux.")} />
                <div className="cmp-choix">
                  <div>
                    <label>{t("Arme A :")}</label>
                    <Dropdown className="menu-cible-arme" options={TOUTES_ARMES.map(a => ({ id: a.id, nom: a.nom }))} value={cmpA.id} onChange={(id) => setCmpA(TOUTES_ARMES.find(a => a.id === id))} />
                    {typeof IMAGES_ARMES !== "undefined" && IMAGES_ARMES[cmpA.id] &&
                      <img className="cmp-vignette" src={IMAGES_ARMES[cmpA.id]} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                  </div>
                  <div>
                    <label>{t("Arme B :")}</label>
                    <Dropdown className="menu-cible-arme" options={TOUTES_ARMES.map(a => ({ id: a.id, nom: a.nom }))} value={cmpB.id} onChange={(id) => setCmpB(TOUTES_ARMES.find(a => a.id === id))} />
                    {typeof IMAGES_ARMES !== "undefined" && IMAGES_ARMES[cmpB.id] &&
                      <img className="cmp-vignette" src={IMAGES_ARMES[cmpB.id]} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                  </div>
                </div>
                <TTKCompareChart a={cmpA} b={cmpB} pvCible={pvCible} setPvCible={setPvCible} />
                <div>
                  <div className="cmp-ligne tete">
                    <span className="cmp-stat">{t("Statistique")}</span>
                    <span className="cmp-val">{cmpA.nom}</span>
                    <span className="cmp-val">{cmpB.nom}</span>
                  </div>
                  {Object.keys(INFOS_STATS).map(stat => {
                    const a = cmpA.stats_base[stat] ?? 0;
                    const b = cmpB.stats_base[stat] ?? 0;
                    let aGagne = false, bGagne = false;
                    if (a !== b) {
                      const aMieux = INFOS_STATS[stat].plusGrandEstMieux ? (a > b) : (a < b);
                      aGagne = aMieux; bGagne = !aMieux;
                    }
                    return (
                      <div className="cmp-ligne" key={stat}>
                        <span className="cmp-stat">{t(INFOS_STATS[stat].label)}</span>
                        <span className={"cmp-val" + (aGagne ? " gagne" : "")}>{a}</span>
                        <span className={"cmp-val" + (bGagne ? " gagne" : "")}>{b}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {vue === "meta" && (
              <div>
                <Banniere icone={navItems.find(n => n.id === "meta").ico} titre={t("Méta — Tier list")}
                  sous={t("Classement indicatif des armes, basé sur la méta codmunity (modifiable dans donnees.js).")} />
                <div>
                  {(() => {
                    const ordreCats = [];
                    TOUTES_ARMES.forEach(a => { if (!ordreCats.includes(a.categorie)) ordreCats.push(a.categorie); });
                    return ordreCats.map(cat => {
                      const armesCat = TOUTES_ARMES.filter(a => a.categorie === cat);
                      const groupes = {};
                      armesCat.forEach(a => { const t = TIERS[a.id] || "N"; (groupes[t] = groupes[t] || []).push(a); });
                      return (
                        <div className="meta-categorie" key={cat}>
                          <h3 className="meta-cat-titre">{t(cat)}</h3>
                          {TIERS_ORDRE.concat(["N"]).map(tl => {
                            const armes = groupes[tl];
                            if (!armes || !armes.length) return null;
                            return (
                              <div className={"tier tier-" + tl} key={tl}>
                                <div className="tier-lettre">{tl === "N" ? "?" : tl}</div>
                                <div className="tier-armes">
                                  {armes.map(a => {
                                    const src = (typeof IMAGES_ARMES !== "undefined") ? IMAGES_ARMES[a.id] : null;
                                    return (
                                      <span className="tier-arme" key={a.id} role="button" tabIndex={0}
                                        title={t("Ouvrir dans le créateur de classe")}
                                        onClick={() => ouvrirDansCreateur(a)}
                                        onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ouvrirDansCreateur(a); } }}>
                                        {src && <img src={src} alt="" onError={(e) => { e.target.style.display = "none"; }} />}
                                        {a.nom}
                                      </span>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      );
                    });
                  })()}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
